name: resume-test
mode: full
tags: [smoke, resume-test]
notes: "Interrupt/resume test (kill -9 mid-train and mid-save)."
data:
  sources:
    - {name: tiled10s, manifest: ${UIUI_ML_ROOT}/smoke10s/manifest.jsonl, weight: 1.0}
  batch_size: 8
  max_secs: 10.0
  num_workers: 4
  text_norm: none
  specaugment: {enabled: true}
optim: {lr: 1.0e-5, betas: [0.9, 0.98], weight_decay: 1.0e-3, warmup_steps: 20, grad_clip: 1.0, accum: 1}
ema: {enabled: true, decay: 0.99}
train: {total_steps: 900, log_every: 10, seed: 0, ddp_grad_bf16: true}
eval: {sets: []}
checkpoint: {every: 100000, every_minutes: 0.7, keep_last: 2, keep_optim: 2}
