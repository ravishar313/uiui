# Dense teacher for round 3 distillation (same data as round 2, full precision). Derived from round2_qat_v1.yaml.
# Round 2 (2x RTX 5090): five-value QAT from the shipping Phonon-2 container, ~520 h, 2 epochs.
# Fixes from pilot-full-v1: clips up to 15 s (recovers ~135 h incl. most of LibriSpeech), English ~38% of sampling
# (Common Voice India full + LibriSpeech) to stop Hindi spellings bleeding into English. QAT keeps every encoder
# linear on the shipped five-value grid, so evals here already reflect the shipping quantization.
name: teacher-dense-r2
mode: full
tags: [round3, teacher, full]
parent: "Phonon-2 (our export, unmodified)"
notes: "Full-precision teacher for round-3 distillation: round-2 mix (Hinglish 60% incl. Vaani / Indian English 25% / plain English 15%), 15 s clips, single GPU1 with accum 2. Not shippable as is (dense)."
data:
  sources:
    - {name: indicvoices,  manifest: ${UIUI_ML_ROOT}/data/manifests/indicvoices/train.jsonl,  weight: 0.13}
    - {name: indicvoices2, manifest: ${UIUI_ML_ROOT}/data/manifests/indicvoices2/train.jsonl, weight: 0.15}
    - {name: vaani,        manifest: ${UIUI_ML_ROOT}/data/manifests/vaani/train.jsonl,        weight: 0.15}
    - {name: mucs,         manifest: ${UIUI_ML_ROOT}/data/manifests/mucs/train.jsonl,         weight: 0.11}
    - {name: kathbath,     manifest: ${UIUI_ML_ROOT}/data/manifests/kathbath/train.jsonl,     weight: 0.04}
    - {name: shrutilipi,   manifest: ${UIUI_ML_ROOT}/data/manifests/shrutilipi/train.jsonl,   weight: 0.02}
    - {name: cvindia_full, manifest: ${UIUI_ML_ROOT}/data/manifests/cvindia_full/train.jsonl, weight: 0.25}
    - {name: librispeech,  manifest: ${UIUI_ML_ROOT}/data/manifests/librispeech/train.jsonl,  weight: 0.15}
  batch_size: 8           # per GPU; 15 s clips (12 OOMed at >28 GB in QAT)
  max_secs: 15.0
  num_workers: 6
  text_norm: none
  specaugment: {enabled: true}
optim: {lr: 5.0e-5, betas: [0.9, 0.98], weight_decay: 1.0e-3, min_lr: 1.0e-6, warmup_steps: 500, grad_clip: 1.0, accum: 2}
train: {total_steps: 16000, log_every: 20, tdt_sigma: 0.02, seed: 1, ddp_grad_bf16: true, joint_chunk: 8}
ema: {enabled: true, decay: 0.999}
model: {bn_eval: true}
precision: bf16
eval:
  every: 2000
  at_start: true
  batch_size: 16
  best_metric: {set: dev-mix, category: ALL, key: wer}
  sets:
    - {name: dev-mix,           manifest: ${UIUI_ML_ROOT}/data/manifests/dev-mix.jsonl}
    - {name: hiacc,             manifest: ${UIUI_ML_ROOT}/data/evalsets-lexicon/hiacc/manifest.jsonl, max_clips: 150}
    - {name: mucs-hien-test,    manifest: ${UIUI_ML_ROOT}/data/evalsets-lexicon/mucs-hien-test/manifest.jsonl, max_clips: 150}
    - {name: fleurs-hi,         manifest: ${UIUI_ML_ROOT}/data/evalsets-lexicon/fleurs-hi/manifest.jsonl, max_clips: 100}
    - {name: svarah-partial,    manifest: ${UIUI_ML_ROOT}/evalsets/svarah-partial/manifest.jsonl, max_clips: 150}
    - {name: monsoon-en-in,     manifest: ${UIUI_ML_ROOT}/evalsets/monsoon-en-in/manifest.jsonl, max_clips: 100}
    - {name: librispeech-clean, manifest: ${UIUI_ML_ROOT}/evalsets/librispeech-clean/manifest.jsonl, max_clips: 100}
checkpoint: {every: 2000, every_minutes: 20, keep_last: 2, keep_optim: 2, dtype: float32}
